name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release configuration and safety gate
        env:
          CONTENT_SAFETY_APPROVED: ${{ vars.CONTENT_SAFETY_APPROVED }}
          CATALOG_AUDIO_BASE_URL: ${{ vars.CATALOG_AUDIO_BASE_URL }}
          FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
        run: |
          test "$CONTENT_SAFETY_APPROVED" = "true"
          test -n "$CATALOG_AUDIO_BASE_URL"
          test -n "$FUNCTIONS_BASE_URL"
      - run: npm run build
        env:
          VITE_BASE_PATH: /eardium-web/
          VITE_CATALOG_AUDIO_BASE_URL: ${{ vars.CATALOG_AUDIO_BASE_URL }}
          VITE_FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
          VITE_WEB_APP_URL: https://eardium.github.io/eardium-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
